databaseChangeLog:
  - changeSet:
      id: 014-migrate-account-type-to-roles
      author: Ozodbek Mamadjanov
      changes:
        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = u.account_type;
        - dropColumn:
            tableName: users
            columnName: account_type