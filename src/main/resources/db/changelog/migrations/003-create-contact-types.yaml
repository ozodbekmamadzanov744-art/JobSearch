databaseChangeLog:
  - changeSet:
      id: 003-create-contact-types
      author: Ozodbek Mamadjanov
      changes:
        - createTable:
            tableName: contact_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false