databaseChangeLog:
  - changeSet:
      id: 002-create-users
      author: Ozodbek Mamadjanov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(255)
              - column:
                  name: age
                  type: INT
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(55)
              - column:
                  name: avatar
                  type: VARCHAR(500)
              - column:
                  name: account_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false